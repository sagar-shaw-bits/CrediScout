apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Environment-agnostic building blocks for the stateless CrediScout server.
# Do not apply this directly — pick an overlay:
#   kubectl apply -k deploy/overlays/local   (kind)
#   kubectl apply -k deploy/overlays/gke     (Google Kubernetes Engine)
resources:
  - namespace.yaml
  - configmap.yaml
  - app-deployment.yaml
  - app-service.yaml
  - app-hpa.yaml
  - app-pdb.yaml
