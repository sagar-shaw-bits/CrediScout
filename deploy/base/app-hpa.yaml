apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: crediscout
  namespace: crediscout
  labels:
    app.kubernetes.io/name: crediscout
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: crediscout-server
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
