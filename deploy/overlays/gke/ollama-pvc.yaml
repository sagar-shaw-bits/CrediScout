apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: crediscout
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/component: llm
spec:
  accessModes:
    - ReadWriteOnce
  # GKE default dynamic provisioner. Use "standard-rwo" (balanced PD) or
  # "premium-rwo" (SSD) for faster model loads if desired.
  storageClassName: standard-rwo
  resources:
    requests:
      # Holds llama3.2 (~2 GB) + nomic-embed-text (~275 MB) with headroom.
      storage: 20Gi
