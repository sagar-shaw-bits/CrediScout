apiVersion: v1
kind: Service
metadata:
  name: crediscout
  namespace: crediscout
  annotations:
    # Container-native load balancing: the GCLB targets Pod IPs directly (NEG)
    # instead of node ports, and uses the BackendConfig health check on /healthz.
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "crediscout-backendconfig"}'
